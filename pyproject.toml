[tool.poetry]
name = "mat"
version = "0.1.0"
description = "MAT: Mask-Aware Transformer for Large Hole Image Inpainting"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "networks"}, {include = "losses"}, {include = "metrics"}, {include = "torch_utils"}, {include = "dnnlib"}, {include = "training"}, {include = "datasets"}]

[tool.poetry.dependencies]
python = "^3.8"
easydict = "*"
future = "*"
matplotlib = "*"
numpy = "*"
opencv-python = "*"
scikit-image = "*"
scipy = "*"
click = "*"
requests = "*"
tqdm = "*"
pyspng = "*"
ninja = "*"
imageio-ffmpeg = "0.4.3"
timm = "*"
psutil = "*"
scikit-learn = "*"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-mock = "^3.11.0"

[tool.poetry.scripts]
test = "pytest:main"
tests = "pytest:main"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=networks",
    "--cov=losses", 
    "--cov=metrics",
    "--cov=torch_utils",
    "--cov=dnnlib",
    "--cov=training",
    "--cov=datasets",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html:htmlcov",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=80",
    "-vv",
    "--tb=short",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests", 
    "slow: Slow-running tests",
]

[tool.coverage.run]
source = ["networks", "losses", "metrics", "torch_utils", "dnnlib", "training", "datasets"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "pass",
    "except ImportError:",
]
show_missing = true
precision = 2
skip_covered = false

[tool.coverage.html]
directory = "htmlcov"

[tool.coverage.xml]
output = "coverage.xml"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"